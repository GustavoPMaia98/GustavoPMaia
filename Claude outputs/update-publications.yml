# Refreshes data/publications.json (new papers, citation counts, BibTeX/APA)
# from OpenAlex every night. The website reads that file; nothing else to do.
name: Update publications

on:
  schedule:
    - cron: "17 4 * * *"          # every day at 04:17 UTC
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - tools/update_publications.py
      - .github/workflows/update-publications.yml

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch publications from OpenAlex
        run: python tools/update_publications.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/publications.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update publications and citation counts"
            git push
          else
            echo "No changes."
          fi
