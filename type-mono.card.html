<!-- @dsCard group="Colors" viewport="700x150" name="Semantic Status" subtitle="Terminal traffic-lights: live, warn, danger" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);padding:22px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .box{flex:1;min-width:120px;border-radius:var(--radius-md);padding:14px 16px;border:1px solid var(--border);background:var(--card);display:flex;align-items:center;gap:12px}
  .dot{width:16px;height:16px;border-radius:50%;flex:none}
  .name{font-weight:700;font-size:.86rem}
  .hex{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
  <div class="row">
    <div class="box"><span class="dot" style="background:var(--status-live);box-shadow:0 0 0 4px rgba(40,200,64,.18)"></span><div><div class="name">Live</div><div class="hex">#28c840</div></div></div>
    <div class="box"><span class="dot" style="background:var(--status-warn)"></span><div><div class="name">Warn / poster</div><div class="hex">#fbbf24</div></div></div>
    <div class="box"><span class="dot" style="background:var(--status-danger)"></span><div><div class="name">Danger / close</div><div class="hex">#ff5f57</div></div></div>
  </div>
</body>
</html>
