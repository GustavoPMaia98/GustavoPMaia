<!-- @dsCard group="Type" viewport="700x150" name="Mono & Eyebrow" subtitle="Terminal moments and uppercase labels" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);padding:24px}
  .row{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .mono{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
  .date{font-family:var(--font-mono);font-size:.78rem;font-weight:700;color:var(--accent)}
  .kbd{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 7px;background:rgba(255,255,255,.04)}
  .eyebrow{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--text)}
  .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
  <div class="row">
    <span class="mono">~/updates</span>
    <span class="date">Oct 2025</span>
    <span class="kbd">⌘ K</span>
    <span class="kbd">Esc</span>
    <span class="eyebrow">Publications</span>
  </div>
  <p class="meta">--font-mono · eyebrow: .72rem / 800 / .06em uppercase</p>
</body>
</html>
