<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4 · 8 · 12 · 16 · 20 · 26 · 40" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);padding:24px}
  .row{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
  .item{text-align:center}
  .bar{background:linear-gradient(180deg,var(--accent),var(--accent-strong));width:100%;border-radius:3px}
  .cell{width:46px}
  .val{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
  <div class="row">
    <div class="item cell"><div class="bar" style="height:4px"></div><div class="val">4</div></div>
    <div class="item cell"><div class="bar" style="height:8px"></div><div class="val">8</div></div>
    <div class="item cell"><div class="bar" style="height:12px"></div><div class="val">12</div></div>
    <div class="item cell"><div class="bar" style="height:16px"></div><div class="val">16</div></div>
    <div class="item cell"><div class="bar" style="height:20px"></div><div class="val">20</div></div>
    <div class="item cell"><div class="bar" style="height:26px"></div><div class="val">26</div></div>
    <div class="item cell"><div class="bar" style="height:40px"></div><div class="val">40</div></div>
  </div>
</body>
</html>
