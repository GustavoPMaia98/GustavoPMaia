<!-- @dsCard group="Type" viewport="700x200" name="Display — Fraunces" subtitle="Variable serif for headings & brand flourishes" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);padding:24px}
  .display{font-family:var(--font-display);font-weight:600;line-height:1.15;letter-spacing:-.01em;margin:0}
  .hero{font-size:2.6rem}
  .h2{font-size:1.9rem;margin-top:10px}
  .brand{font-family:var(--font-display);font-style:italic;font-weight:700;font-size:2rem;color:var(--accent);margin-top:10px}
  .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
  <p class="display hero">Origin of Life</p>
  <p class="display h2">Mechanochemical synthesis</p>
  <p class="brand">Cientifica(mente)</p>
  <p class="meta">Fraunces · 600 / 700 italic · --font-display</p>
</body>
</html>
