<!-- @dsCard group="Type" viewport="700x210" name="Body — Manrope" subtitle="Humanist sans for all body & UI, 400–800" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--text);padding:24px}
  .lead{font-size:1.05rem;font-weight:600;margin:0 0 8px}
  .para{font-size:1rem;line-height:1.6;color:#d6deea;max-width:60ch;margin:0 0 12px}
  .weights{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
  .weights span{font-size:1.15rem}
  .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
  <p class="lead">Mechanochemical Reactivity of Ribonucleosides</p>
  <p class="para">Research on mechanochemical and shock-driven synthesis of organic molecules relevant to prebiotic chemistry and the origin of life.</p>
  <div class="weights">
    <span style="font-weight:400">Regular 400</span>
    <span style="font-weight:500">Medium 500</span>
    <span style="font-weight:600">Semibold 600</span>
    <span style="font-weight:700">Bold 700</span>
    <span style="font-weight:800">Extrabold 800</span>
  </div>
  <p class="meta">Manrope · --font-body</p>
</body>
</html>
