<!-- NEWS -->
<section class="section" id="news">
  <h2>News</h2>
  <div class="news reveal" aria-label="Latest news">
    <!--
      News is data-driven. Cards are built on every page load from data/news.json
      (sorted newest-first automatically). To add a post: add an entry to that file.

      OPTIONAL live LinkedIn: LinkedIn has no public API and blocks direct browser
      fetches, so a static site cannot read your feed. If you set up a free
      LinkedIn→RSS bridge (e.g. rss.app) that gives a JSON-feed URL, paste it into
      data-news-feed below; the site will fetch it on load, merge it with
      news.json, and re-sort. Leave empty to use news.json only.
    -->
    <div class="news-carousel" data-carousel data-autoplay="5500"
         data-news-src="data/news.json" data-news-feed="">
      <button class="news-arrow news-arrow--prev" type="button" aria-label="Previous update" data-carousel-prev>
        <i data-lucide="chevron-left"></i>
      </button>

      <div class="news-viewport" data-carousel-viewport>
        <div class="news-track" data-carousel-track>
          <!-- filled by renderNews() in script.js -->
        </div>
      </div>

      <button class="news-arrow news-arrow--next" type="button" aria-label="Next update" data-carousel-next>
        <i data-lucide="chevron-right"></i>
      </button>
    </div>

    <div class="news-pager" data-carousel-pager aria-label="Choose an update"></div>
    <a class="news-more" href="https://www.linkedin.com/in/gustavopinhomaia" target="_blank" rel="noopener noreferrer" data-pt="Mais novidades no LinkedIn ↗">More updates on LinkedIn ↗</a>
  </div>
</section>
