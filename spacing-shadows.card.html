<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--bg-nebula);background-attachment:fixed;font-family:var(--font-body);color:var(--text);padding:24px}
  .row{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
  .logo{font-family:var(--font-display);font-weight:700;font-size:2.2rem;line-height:1;letter-spacing:.02em;color:var(--text)}
  .logo span{color:var(--accent)}
  .affil{display:flex;gap:14px}
  .tile{width:74px;height:74px;display:flex;align-items:center;justify-content:center;padding:11px;border-radius:14px;background:#fff;border:1px solid var(--border);box-shadow:var(--glow-frame)}
  .tile img{max-width:100%;max-height:100%;object-fit:contain}
  .meta{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
  <div class="row">
    <div class="logo">G<span>P</span>M</div>
    <div class="affil">
      <span class="tile"><img src="../assets/logos/cqe-t.png" alt="CQE"></span>
      <span class="tile"><img src="../assets/logos/nasa-t.png" alt="NASA"></span>
      <span class="tile"><img src="../assets/logos/impmc-t.png" alt="IMPMC"></span>
      <span class="tile"><img src="../assets/logos/mnhn.png" alt="MNHN"></span>
    </div>
  </div>
  <div class="meta">Fraunces 700 · cyan accent on the P</div>
</body>
</html>
