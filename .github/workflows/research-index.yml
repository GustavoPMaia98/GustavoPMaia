# Builds the index "Ask my research" searches (data/research-index.json) from the site's
# own content, with meaning vectors from a small open model (bge-small-en-v1.5, MIT licence)
# whose files are saved in vendor/models so visitors load them from this site.
# Runs every night (after "Update site data"), from the Actions tab, and when the
# builder itself changes on a branch other than main.
name: Build research index

on:
  schedule:
    - cron: "47 4 * * *"          # every day at 04:47 UTC
  workflow_dispatch:
  push:
    branches-ignore: [main]
    paths: [tools/build_research_index.mjs]

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install transformers.js (Apache 2.0)
        # the CPU runtime is enough; skip onnxruntime-node's optional GPU (CUDA) download,
        # which fails with 404 on runners where it guesses a CUDA version
        run: npm install --no-save --prefix "$RUNNER_TEMP/ai" --onnxruntime-node-install-cuda=skip @huggingface/transformers@3.8.1
      - name: Build the index
        run: TRANSFORMERS="$RUNNER_TEMP/ai/node_modules/@huggingface/transformers/dist/transformers.node.mjs" node tools/build_research_index.mjs
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/git_publish.py --branch "$GITHUB_REF_NAME" --message "Update the research index" --paths data/research-index.json vendor/models
