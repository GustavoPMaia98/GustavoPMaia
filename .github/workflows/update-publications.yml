# Finds and verifies your journal articles (ORCID + Crossref + OpenAlex; author,
# field and identity checks) and writes data/publications.json every night.
name: Update publications

on:
  schedule:
    - cron: "17 4 * * *"          # every day at 04:17 UTC
  workflow_dispatch:               # "Run workflow" button in the Actions tab
  # (no run on push: the bot's commit would otherwise land right after yours and
  #  GitHub Desktop would ask you to pull before every next push)

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find and verify publications
        run: python tools/update_publications.py
      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain data/publications.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.json
            git commit -m "Update verified publication list"
            # if you pushed while this was running, put this commit on top of yours
            for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          else
            echo "No changes."
          fi
