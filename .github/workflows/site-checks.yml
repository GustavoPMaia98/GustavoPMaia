# Runs on every push / pull request: broken links and images, oversized
# images, the data files, the security policy and JavaScript syntax.
# A red cross in GitHub means something to fix.
name: Site checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read            # this job only reads the code

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Links, images and file sizes
        run: python tools/check_site.py
      - name: JavaScript syntax
        run: |
          for f in script.js search.js render.js mail.js sw.js i18n/translations.js; do node --check "$f"; done
