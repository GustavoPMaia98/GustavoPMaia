# Issues -> New issue -> "Blog draft from notes (AI)": an open model (Mistral 7B, Apache 2.0)
# run with Ollama on GitHub's machine writes a draft in English and Portuguese, saved hidden
# in data/blog.json and posted on the issue. Add the "publish" label to the issue to put
# it on the website, or comment just: publish (the Blog section appears once it has a post).
# Only issues opened by the owner of the repository are used.
name: Blog draft from notes (AI)

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-draft-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  draft:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'blog-draft') || startsWith(github.event.issue.title, 'Blog draft:')) &&
      (github.event.action == 'opened' || github.event.label.name == 'redraft')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Start Ollama with Mistral 7B
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s http://127.0.0.1:11434 >/dev/null && break; sleep 2; done
          ollama pull mistral:7b
      - name: Write the draft
        run: python3 tools/blog_draft.py draft "$GITHUB_EVENT_PATH" > draft.md
      - name: Save it (hidden) and post it on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json
          git commit -m "Blog draft from issue #$NUMBER (hidden)" || true
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          { echo "Here is the draft, saved hidden in \`data/blog.json\` (AI-written from your notes: please check it)."
            echo; echo "- To put it on the website, comment just \`publish\` (or add the **publish** label)."
            echo "- To change it, edit the post in \`data/blog.json\` (it has \`\"issue\": $NUMBER\`)."
            echo "- For a new attempt, edit the notes above and add the **redraft** label."
            echo; cat draft.md; } > comment.md
          gh issue comment "$NUMBER" --body-file comment.md

  publish:
    if: >-
      github.event.sender.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'blog-draft') || startsWith(github.event.issue.title, 'Blog draft:')) &&
      ((github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'publish') ||
       (github.event_name == 'issue_comment' && github.event.comment.body == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 tools/blog_draft.py publish "$GITHUB_EVENT_PATH" | tee out.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json
          git commit -m "Publish blog post from issue #$NUMBER" || { echo "Nothing to publish."; exit 0; }
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
          gh issue comment "$NUMBER" --body "$(tail -n 1 out.txt) It will be on the website in a minute or two."
          gh issue close "$NUMBER"
