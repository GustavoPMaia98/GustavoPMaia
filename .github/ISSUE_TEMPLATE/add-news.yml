name: Add a news item
description: Add an announcement or recent activity to the News section.
title: "Add news: "
labels: [add-news]
body:
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: "2026-11"
    validations: { required: true }
  - type: textarea
    id: text_en
    attributes:
      label: English text
    validations: { required: true }
  - type: textarea
    id: text_pt
    attributes:
      label: Portuguese text
  - type: input
    id: href
    attributes:
      label: Link (optional)
      placeholder: "https://..."
  - type: textarea
    id: media
    attributes:
      label: Picture (optional)
      description: Drag a PNG or JPG here.
